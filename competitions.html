<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitions | Tiffany Huang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css?v=20261116">
</head>
<body data-page="competitions">

<header class="page-header"><div class="ph-inner">
  <h1 class="page-title reveal" data-en="Global <em>Competitions</em>">競賽 <em>經歷</em></h1>
  <p class="page-sub reveal" data-en="An open brief becomes a scoped problem, a clear plan, and a deliverable that ships on time.">把開放式題目收斂成具體問題、清楚的分工，以及準時交出的成果。</p>
</div></header>

<main class="main">
  <div class="comp-card reveal">
    <div class="comp-img-wrap"><img src="images/hackathon-app.jpg" class="comp-img lb-trigger" data-gallery="hotai" alt="迷霧地圖 App 示意畫面"></div>
    <div class="comp-content">
      <div class="comp-header-row">
        <div class="comp-award" data-en="Project Manager">專案經理</div>
        <div class="comp-date">2026/09</div>
      </div>
      <h3 class="comp-h3" data-en="2026 HOTAI AI Hackathon">2026 和泰 AI 黑客松</h3>
      <div class="comp-org"><i class="fas fa-car"></i> <span data-en="yoxi Corporate Challenge · Team &quot;Braised Hot-Spring Fish&quot;">yoxi 企業挑戰 · 團隊「紅燒溫泉魚」</span></div>
      <p class="comp-desc" data-en="Led a 5-person team of UI/UX designers and back-end engineers to pitch <strong>Huli &amp; the Fog Map</strong> — three features that give riders a reason to open yoxi even on days they don't ride. Narrowed 5 ideas to 2 core features in Jira and submitted the first draft 3 days early.">帶領 UI/UX 與後端組成的 5 人團隊，提出<strong>「虎力與迷霧地圖」</strong>，讓乘客沒搭車的日子也有理由打開 yoxi。以 Jira 把 5 個構想收斂成 2 個核心功能，初稿提前 3 天交付。</p>
      <div class="gallery-section">
        <div class="gallery-header" data-en="Gallery">提案畫面</div>
        <div class="photo-slider">
          <img src="images/hackathon-app.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
          <img src="images/hackathon-walk.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
          <img src="images/hackathon-hidden.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
          <img src="images/hackathon-routes.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
          <img src="images/hackathon-queue.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
          <img src="images/hackathon-huli4.jpg" class="slide-item lb-trigger" data-gallery="hotai" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="comp-card reveal">
    <div class="comp-img-wrap"><div class="comp-ph"><i class="fas fa-trophy"></i><span>3rd Place</span></div></div>
    <div class="comp-content">
      <div class="comp-header-row">
        <div class="comp-award" data-en="3rd Place">第三名</div>
        <div class="comp-date">2021</div>
      </div>
      <h3 class="comp-h3" data-en="Freshman English Presentation Contest">全體新生英文簡報競賽</h3>
      <div class="comp-org"><i class="fas fa-university"></i> <span data-en="NTUB · Applied Foreign Languages">國立臺北商業大學 · 應用外語系</span></div>
      <p class="comp-desc" data-en="Placed third in the department-wide English presentation contest for all incoming students.">在應外系全體新生英文簡報競賽中獲得第三名。</p>
    </div>
  </div>
</main>

<script src="site.js?v=20261116"></script>
</body>
</html>
