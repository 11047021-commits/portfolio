<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>九州冬旅行程・展示版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 博多織の帯 header → sticky day tabs → timeline (left) + illustrated Kyushu map (right, sticky); one column with 行程/地圖 toggle on phones */
:root{
  --paper:#ECEFF1;      /* 淡藍の和紙 */
  --card:#FBFCFC;
  --ink:#17203A;        /* 墨・紺 */
  --ink-2:#56607A;
  --line:#CBD2DA;
  --ai:#25487D;         /* 藍 */
  --shu:#C4422B;        /* 鳥居の朱 */
  --kin:#B9862A;        /* 金茶 */
  --land:#E5DFD0;
  --sea:#D6E1E8;
  --wave:#C3D2DC;
  --d1:#1F3263; --d2:#C4422B; --d3:#B9862A; --d4:#25487D; --d5:#6B4A8E; --d6:#3F8463; --d7:#9A6634;
  --on-accent:#FFFFFF;
  --f-display:"Shippori Mincho B1","Noto Serif TC","Hiragino Mincho ProN","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1528; --card:#182038; --ink:#ECE6D7; --ink-2:#A3ABC2; --line:#2B3654;
    --ai:#86A8DE; --shu:#E86A50; --kin:#E2B25A; --land:#1F2843; --sea:#121A31; --wave:#1B2643;
    --d1:#8EA3E0; --d2:#E86A50; --d3:#E2B25A; --d4:#6FA0E6; --d5:#B595DE; --d6:#6FC296; --d7:#D9A06A;
    --on-accent:#10162A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1528; --card:#182038; --ink:#ECE6D7; --ink-2:#A3ABC2; --line:#2B3654;
  --ai:#86A8DE; --shu:#E86A50; --kin:#E2B25A; --land:#1F2843; --sea:#121A31; --wave:#1B2643;
  --d1:#8EA3E0; --d2:#E86A50; --d3:#E2B25A; --d4:#6FA0E6; --d5:#B595DE; --d6:#6FC296; --d7:#D9A06A;
  --on-accent:#10162A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* ── 博多織 献上柄の帯 ── */
.obi{display:block;width:100%;height:30px;color:var(--ai)}
.obi .k1{fill:var(--ai)} .obi .k2{fill:var(--shu)} .obi .k3{fill:var(--kin)} .obi .bg{fill:var(--paper)}

header.hero{padding-block:22px 18px}
.hero-row{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1.08;margin:6px 0 8px;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:.42em;font-weight:600;letter-spacing:.18em;color:var(--ink-2);margin-top:8px}
h1 small span{white-space:nowrap}
.hero-row{position:relative}
@media (max-width:600px){
  .hero-row > div:first-child{padding-right:64px}
  .hanko{position:absolute;right:0;top:0;width:54px;height:54px;font-size:18px;border-width:2.5px}
  h1{font-size:29px}
  h1 small{letter-spacing:.08em;font-size:14px}
}
.hanko{flex:none;width:76px;height:76px;border:3px solid var(--shu);border-radius:8px;color:var(--shu);display:grid;place-items:center;transform:rotate(-6deg);font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.02;text-align:center;writing-mode:vertical-rl;letter-spacing:.06em;opacity:.92;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:14px}
.meta b{color:var(--ink);font-weight:700;font-family:var(--f-mono);font-size:15px}
.countdown{font-family:var(--f-display);font-weight:800;color:var(--shu)}

/* ── sticky bar ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;line-height:1.15;text-align:left}
.tab .kj{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--on-accent);background:var(--c)}
.tab .t1{font-family:var(--f-mono);font-size:13px;font-weight:500}
.tab .t2{font-size:11.5px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.tab[aria-selected="true"] .t2{color:var(--on-accent);opacity:.85}
.tab[aria-selected="true"] .kj{background:var(--on-accent);color:var(--c)}
.tab.all .kj{background:var(--ink);color:var(--paper)}
.tab.all{--c:var(--ink)}
.viewtoggle{display:none;gap:6px;padding-bottom:10px}
.viewtoggle button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 0;font-weight:500}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ── main grid ── */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:28px;padding-block:22px 60px}
.col-map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start}
@media (max-width:880px){
  main{grid-template-columns:minmax(0,1fr)}
  .viewtoggle{display:flex}
  .col-map{position:static}
  body[data-view="list"] .col-map{display:none}
  body[data-view="map"] .col-list{display:none}
}

/* ── day header ── */
.dayhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:18px}
.daykanji{width:68px;height:68px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px}
.dayhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.4vw,32px);margin:0;line-height:1.2;text-wrap:balance}
.dayhead .d{font-family:var(--f-mono);color:var(--ink-2);font-size:13px;letter-spacing:.06em}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 22px;padding:0;list-style:none}
.facts li{font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:4px 10px;color:var(--ink-2)}
.facts li b{color:var(--ink);font-weight:500}

/* ── timeline ── */
.tl{list-style:none;margin:0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;position:relative}
.stop .time{font-family:var(--f-mono);font-size:14px;font-weight:500;padding-top:16px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.stop .time span{display:block;font-size:10.5px;color:var(--ink-2);letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 14px 18px;position:relative;overflow:hidden;transition:opacity .25s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(180deg,var(--c) 0 10px,transparent 10px 13px)}
.card.sel{box-shadow:0 0 0 2px var(--c)}
.chead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.num{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);font-family:var(--f-mono);font-size:12px;display:grid;place-items:center;font-weight:500;margin-top:3px}
.card h3{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.3;margin:0}
.card .jp{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.card p{margin:8px 0 0;font-size:14.5px;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11.5px;border-radius:4px;padding:1px 8px;border:1px solid var(--line);color:var(--ink-2)}
.chip.t{border-color:var(--c);color:var(--c);font-weight:500}
.tips{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);list-style:none;font-size:13.5px;color:var(--ink-2);display:grid;gap:3px}
.tips li{padding-left:1.1em;text-indent:-1.1em}
.tips li::before{content:"・";color:var(--c);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts a,.acts button{font-size:12.5px;text-decoration:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center}
.acts a.go{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.acts a:hover,.acts button:hover{border-color:var(--ink)}
.acts .done{margin-left:auto}
.stamp{position:absolute;right:14px;top:10px;width:58px;height:58px;border:2.5px solid var(--shu);border-radius:50%;color:var(--shu);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;transform:rotate(-14deg) scale(.6);opacity:0;pointer-events:none;transition:all .2s}
.card.is-done .stamp{opacity:.85;transform:rotate(-14deg) scale(1)}
.card.is-done > *:not(.stamp):not(.notes-box):not(.acts){opacity:.55}
.move{grid-column:2;font-size:12.5px;color:var(--ink-2);padding:8px 0 8px 18px;margin-left:4px;border-left:2px dotted var(--line);display:flex;gap:6px;align-items:center}
.move .mv{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink)}

/* ── map ── */
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.maphead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.maphead .ttl{font-family:var(--f-display);font-weight:800;font-size:16px}
.maphead button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 10px;font-size:12.5px}
#map{display:block;width:100%;aspect-ratio:1/1;max-width:100%;touch-action:manipulation}
#map .land{fill:var(--land);stroke:var(--ink-2);stroke-width:1.1;stroke-linejoin:round}
#map .seawave{fill:none;stroke:var(--wave);stroke-width:1}
#map .lbl-sea{fill:var(--ai);opacity:.55;font-family:var(--f-display);font-weight:600}
#map .lbl-city{fill:var(--ink-2);font-family:var(--f-display);font-weight:600}
#map .lbl-mtn{fill:var(--ink-2);font-family:var(--f-body)}
#map .mtn{fill:none;stroke:var(--ink-2);stroke-linejoin:round}
#map .route{fill:none;stroke-linecap:round;stroke-linejoin:round}
#map .pin{cursor:pointer}
#map .pin text{font-family:var(--f-mono);font-weight:500;fill:var(--on-accent);pointer-events:none}
#map .plabel{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-linejoin:round}
.mapnote{padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;min-height:64px}
.mapnote .nm{font-family:var(--f-display);font-weight:800;font-size:16px}
.mapnote .sub{color:var(--ink-2);font-size:12.5px}
.mapnote a{display:inline-block;margin-top:6px;font-size:12.5px;text-decoration:none;background:var(--ink);color:var(--paper);border-radius:6px;padding:3px 10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ── overview ── */
.ov-days{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:10px}
.ov-day{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%}
.ov-day:hover{border-color:var(--c)}
.ov-day .daykanji{width:50px;height:50px;font-size:24px}
.ov-day .dt{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.ov-day .ar{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.3}
.ov-day .rt{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:2px}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:0;border-top:1px solid var(--line)}
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:30px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px;position:relative}
.ticket::after{content:"";position:absolute;right:86px;top:10px;bottom:10px;border-left:1px dashed var(--line)}
.ticket .code{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.ticket .route{font-family:var(--f-mono);font-size:22px;font-weight:500;display:flex;gap:10px;align-items:baseline}
.ticket .route small{font-size:12px;color:var(--ink-2)}
.ticket .when{font-size:13px;color:var(--ink-2)}
.ticket .side{position:absolute;right:14px;top:14px;width:62px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--shu);line-height:1.3}
.stays{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:30px}
.stays-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:30px}
.stays-wrap .stays{margin:0}
.stays th,.stays td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.stays tr:last-child td{border-bottom:0}
.stays th{font-size:12px;color:var(--ink-2);font-weight:500}
.stays td.n{font-family:var(--f-mono);white-space:nowrap}
.stays .assume{font-size:11.5px;color:var(--kin);display:block}
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.notes li{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.notes li b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px;font-family:var(--f-display);font-weight:800}
footer{color:var(--ink-2);font-size:12px;padding-block:0 40px}
.demo-note{font-size:13px;color:var(--ink-2);border:1px dashed var(--kin);border-radius:8px;padding:8px 12px;margin-bottom:14px}

/* ── shared mode ── */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 8px;color:var(--ink-2)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync.on{color:var(--ink)} .sync.on::before{background:var(--d6)}
.sync.wait::before{background:var(--kin)}
.sync.ro::before{background:var(--ai)}
.chip.mod{border-style:dashed;color:var(--ink-2)}
.who{font-weight:700;color:var(--ink)}
.notes-box{margin-top:10px}
.nlist{list-style:none;margin:0;padding:8px 10px;display:grid;gap:6px;background:var(--paper);border-radius:6px;font-size:13.5px}
.nlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 8px;align-items:baseline}
.nlist .ntext{min-width:0;overflow-wrap:anywhere}
.nlist .nt{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.ndel{border:0;background:transparent;color:var(--ink-2);font-size:15px;line-height:1;padding:0 2px}
.ndel:hover{color:var(--shu)}
.nform{display:flex;gap:6px;margin-top:8px}
.nform input{flex:1;min-width:0}
.editform input,.editform textarea,.nform input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.editform textarea{resize:vertical}
.editform .frow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.editform label{font-size:12.5px;color:var(--ink-2);padding-top:7px}
.acts .primary,.nform .primary{background:var(--shu);border:1px solid var(--shu);color:var(--on-accent);border-radius:6px;padding:4px 12px;font-size:12.5px}
.acts .danger{color:var(--shu);border-color:var(--shu)}
.acts .danger:last-child{margin-left:auto}
.donewrap{margin-left:auto;display:inline-flex;gap:8px;align-items:center}
.doneby{font-size:12px;color:var(--shu)}
.doneby .who{color:var(--shu)}
.card .acts .done{margin-left:0}
.hiddenrow{font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hiddenrow b{text-decoration:line-through;font-weight:500}
.hiddenrow button{margin-left:auto;font-size:12.5px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 10px}
.addbtn{display:block;width:100%;margin-top:14px;border:1.5px dashed var(--line);background:transparent;border-radius:var(--radius);padding:12px;color:var(--ink-2);font-size:14px}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.addform{margin-top:14px}
.ov-day .prog{margin-left:10px;color:var(--shu)}
.recent{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:8px}
.recent button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13.5px}
.recent .rk{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.recent .rs{color:var(--ink-2);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg class="obi" aria-hidden="true" preserveAspectRatio="none">
  <defs>
    <pattern id="kenjo" width="64" height="30" patternUnits="userSpaceOnUse">
      <rect class="bg" width="64" height="30"/>
      <!-- 独鈷 -->
      <rect class="k1" x="3" y="0" width="2" height="30"/>
      <rect class="k1" x="7" y="0" width="1" height="30"/>
      <path class="k1" d="M16 2 L22 9 L16 15 L10 9 Z M16 15 L22 22 L16 29 L10 22 Z"/>
      <circle class="k3" cx="16" cy="9" r="2"/><circle class="k3" cx="16" cy="22" r="2"/>
      <rect class="k1" x="24" y="0" width="1" height="30"/>
      <rect class="k2" x="27" y="0" width="3" height="30"/>

/* merged view of a day: original stops + shared edits + added stops, sorted by time */
function viewStops(d){
  const out=[];
  d.stops.forEach((b,i)=>{ const key=d.id+'-'+i, e=S.edits[key]||null; let s=b;
    if(e){ s=Object.assign({},b); if(e.t) s.t=e.t; if(e.name){ s.name=e.name; if(e.name!==b.name){s.q=e.name+' '+REGION[d.id]; s.short=e.name;} } if(typeof e.desc==='string'&&e.desc) s.desc=e.desc; }
    out.push({key,s,base:b,i,edit:e,hidden:!!(e&&e.hidden),extra:null}); });
  S.extra.filter(x=>x.day===d.id).forEach(x=>out.push({key:'x-'+x.id,s:{t:x.t||'',name:x.name||'未命名',jp:REGION[d.id],desc:x.desc||'',tags:['自訂'],tips:[],q:(x.name||'')+' '+REGION[d.id]},extra:x,hidden:false}));
  out.sort((a,b)=>(a.s.t||'99:99').localeCompare(b.s.t||'99:99'));
  let n=0; out.forEach(o=>{o.n=(!o.hidden&&o.s.ll)?++n:null;});
  return out;
}

function renderList(){

  list.querySelectorAll('input[id],textarea[id]').forEach(i=>keep[i.id]=i.value);
  const ae=document.activeElement; if(ae&&ae.id&&list.contains(ae)){focus=ae.id; try{sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}}
  const d=DAYS.find(x=>x.id===current);
  list.innerHTML = d ? renderDay(d) : renderOverview();
  for(const id in keep){ const i=document.getElementById(id); if(i) i.value=keep[id]; }

  fillNames();
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
async function W(promise){
  try{ await promise; return true; }
  catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'){ S.canWrite=false; S.editing=null; S.adding=null; toast('你目前只有檢視權限，請行程擁有者在分享設定開放「可以互動」'); schedule(); }
    else if(code==='quota_exceeded'){ toast('共用空間已滿，刪掉一些舊留言再試'); }
    else if(code==='revoked'){ S.canWrite=false; schedule(); }
    else toast('沒有存到，請再試一次');
    return false;
  }
}

    await W(db.doc('notes/'+b.dataset.id).delete());
  } else if(act==='edit'){
    S.editing=key; S.confirm=null; S.adding=null; renderList(); const i=document.getElementById('ef-n-'+key); if(i) i.focus();
  } else if(act==='cancel'){
    S.editing=null; S.adding=null; S.confirm=null; renderList();
  } else if(act==='add'){
    S.adding=b.dataset.day; S.editing=null; renderList(); const i=document.getElementById('af-n-'+b.dataset.day); if(i) i.focus();
  } else if(act==='remove'){
    if(S.confirm!==key){ S.confirm=key; renderList(); return; }
    const f=findStop(key); if(!f) return; S.editing=null; S.confirm=null;
    if(f.o.extra) await W(db.doc('extra/'+f.o.extra.id).delete());
    else await W(db.doc('edits/'+key).set(Object.assign({},S.edits[key]||{},{hidden:true,by:S.me,at:now()})));
    renderList();
  } else if(act==='reset'){
    S.editing=null; await W(db.doc('edits/'+key).delete()); renderList();
  } else if(act==='unhide'){
    const e0=S.edits[key]||{}; const rest=Object.assign({},e0,{hidden:false,by:S.me,at:now()});
    await W((e0.t||e0.name||e0.desc)?db.doc('edits/'+key).set(rest):db.doc('edits/'+key).delete());
  }
});
$('#list').addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  if(!db||!S.canWrite) return;
  const fd=new FormData(f), v=k=>String(fd.get(k)||'').trim();
  if(f.dataset.form==='note'){
    const text=v('text').slice(0,300); if(!text) return; const key=f.dataset.key;
    const inp=f.querySelector('input'); inp.value='';
    if(!await W(db.collection('notes').add({key,text,by:S.me,at:now()}))) inp.value=text;
  } else if(f.dataset.form==='edit'){
    const key=f.dataset.key, found=findStop(key); if(!found) return;
    const t=v('t'), name=v('name').slice(0,40), desc=v('desc').slice(0,400); if(!name) return;
    S.editing=null; S.confirm=null;
    if(found.o.extra){ const x=found.o.extra; await W(db.doc('extra/'+x.id).set({day:x.day,t,name,desc,by:x.by||null,at:x.at||now(),editedBy:S.me,editedAt:now()})); }
    else { const b=found.o.base;
      const body={by:S.me,at:now(),hidden:false};
      if(t&&t!==b.t) body.t=t; if(name!==b.name) body.name=name; if(desc!==b.desc) body.desc=desc;
      await W((body.t||body.name||body.desc)?db.doc('edits/'+key).set(body):db.doc('edits/'+key).delete()); }
    renderList();
  } else if(f.dataset.form==='add'){
    const t=v('t'), name=v('name').slice(0,40), desc=v('desc').slice(0,400); if(!name) return;
    S.adding=null;
    await W(db.collection('extra').add({day:f.dataset.day,t,name,desc,by:S.me,at:now()}));
    renderList();
  }
});

/* ── shared store: checks, notes, edits, added stops ── */
async function initShared(){
  if(!(window.claude&&typeof window.claude.use==='function')){ renderStatus(); return; }
  S.mode='loading'; renderStatus();
  let d=null,u=null;
  try{ [d,u]=await Promise.all([claude.use('db'),claude.use('user')]); }catch(e){}
  user=u;
  if(!d){ S.mode='local'; renderStatus(); renderList(); return; }
  db=d;
  try{ S.me=user?await user.id():null; }catch(e){ S.me=null; }
  let cw=null; try{ cw=user?await user.can('data.write'):null; }catch(e){}
  S.canWrite = cw!==false;
  schedule();
  const confirmed=new Set(); const NEED=4;
  const timer=setTimeout(()=>{ if(confirmed.size<NEED){ S.mode='stale'; renderStatus(); } },10000);
  const ok=(name,snap)=>{ if(!snap.metadata.fromCache){ confirmed.add(name); if(confirmed.size>=NEED){ clearTimeout(timer); S.mode='shared'; } } schedule(); };
  const fail=name=>e=>{ confirmed.add(name); if(confirmed.size>=NEED) clearTimeout(timer); if(e&&e.code==='revoked'){ S.canWrite=false; } schedule(); };
  db.collection('checks').onSnapshot(s=>{ const m={}; s.docs.forEach(x=>m[x.id]=x.data()); S.checks=m; ok('checks',s); }, fail('checks'));
  db.collection('notes').onSnapshot(s=>{ S.notes=s.docs.map(x=>Object.assign({},x.data(),{id:x.id})).sort((a,b)=>(a.at||0)-(b.at||0)); ok('notes',s); }, fail('notes'));
  db.collection('edits').onSnapshot(s=>{ const m={}; s.docs.forEach(x=>m[x.id]=x.data()); S.edits=m; ok('edits',s); }, fail('edits'));
  db.collection('extra').onSnapshot(s=>{ S.extra=s.docs.map(x=>Object.assign({},x.data(),{id:x.id})).sort((a,b)=>(a.at||0)-(b.at||0)); ok('extra',s); }, fail('extra'));
}

/* ── routing ── */
function fromHash(){
  const h=location.hash.slice(1);
  if(h==='overview'||DAYS.some(d=>d.id===h)) return h;
  const now=new Date(); const jst=new Date(now.getTime()+9*3600e3).toISOString().slice(0,10);
  const t=DAYS.find(d=>d.date===jst); return t?t.id:'overview';
}
window.addEventListener('hashchange',()=>{current=fromHash();render();});
current=fromHash(); renderStatus(); render();
setInterval(()=>{ if(shared()&&S.notes.length&&!document.querySelector('#list input:focus,#list textarea:focus')) renderList(); },60000);
})();
